name: .NET test coverage
description: Runs dotnet tests with XPlat coverage and adds a coverage table to the job summary.

inputs:
  project-path:
    description: Path to a test project, solution, or directory.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Run tests with coverage
      shell: bash
      env:
        TEST_PROJECT_PATH: ${{ inputs.project-path }}
      run: dotnet test "$TEST_PROJECT_PATH" --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/dotnet-coverage"

    - name: Add coverage summary
      if: always()
      shell: bash
      env:
        RESULTS_DIRECTORY: ${{ runner.temp }}/dotnet-coverage
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        from pathlib import Path
        import os
        import xml.etree.ElementTree as ET

        search_roots = {
            Path(os.environ["RESULTS_DIRECTORY"]),
            Path(os.environ["GITHUB_WORKSPACE"]),
        }
        reports = sorted(
            {
                report.resolve()
                for root in search_roots
                if root.exists()
                for report in root.rglob("coverage.cobertura.xml")
            }
        )

        def percent(rate):
            return f"{float(rate) * 100:.1f}%"

        print("## Test coverage\n")
        if not reports:
            print(
                "No `coverage.cobertura.xml` report was found in the test results "
                "directory or workspace."
            )
        else:
            for report in reports:
                coverage = ET.parse(report).getroot()
                print(f"### `{report.name}`\n")
                print("| Metric | Covered | Total | Coverage |")
                print("| --- | ---: | ---: | ---: |")
                print(
                    f'| Lines | {coverage.attrib["lines-covered"]} | '
                    f'{coverage.attrib["lines-valid"]} | '
                    f'{percent(coverage.attrib["line-rate"])} |'
                )
                branches_valid = int(coverage.attrib["branches-valid"])
                branch_rate = (
                    percent(coverage.attrib["branch-rate"])
                    if branches_valid
                    else "N/A"
                )
                print(
                    f'| Branches | {coverage.attrib["branches-covered"]} | '
                    f'{branches_valid} | {branch_rate} |\n'
                )

                packages = coverage.findall("./packages/package")
                if packages:
                    print("#### Packages\n")
                    print("| Package | Line coverage | Branch coverage |")
                    print("| --- | ---: | ---: |")
                    for package in sorted(
                        packages, key=lambda item: item.attrib.get("name", "")
                    ):
                        print(
                            f'| `{package.attrib.get("name", "unknown")}` | '
                            f'{percent(package.attrib.get("line-rate", "0"))} | '
                            f'{percent(package.attrib.get("branch-rate", "0"))} |'
                        )
                    print()

                classes = coverage.findall("./packages/package/classes/class")
                if classes:
                    print("#### Classes\n")
                    print("| Class / file | Lines covered | Line coverage |")
                    print("| --- | ---: | ---: |")
                    rows = []
                    for item in classes:
                        line_elements = item.findall("./lines/line")
                        total = len(line_elements)
                        covered = sum(
                            int(line.attrib.get("hits", "0")) > 0
                            for line in line_elements
                        )
                        rate = covered / total if total else 0
                        label = item.attrib.get("filename", item.attrib.get("name", ""))
                        rows.append((rate, label, covered, total))
                    for rate, label, covered, total in sorted(rows):
                        print(
                            f"| `{label}` | {covered}/{total} | {rate * 100:.1f}% |"
                        )
                    print()
        PY